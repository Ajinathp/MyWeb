apiVersion: apps/v1
kind: Deployment
metadata:
  name: htmlapp
  namespace: upi
  labels:
    app: htmlapp
spec:
  replicas: 5
  selector:
    matchLabels:
      app: htmlapp
  template:
    metadata:
      labels:
        app: htmlapp
    spec:
      containers:
      - name: html
        image: ajinathp/html:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: htmlapp-hpa
  namespace: upi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: htmlapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
